<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Escuela de Cerámica N°1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #d8e0f0;
        }
        .wrapper {
            position: relative;
            width: 850px;
            height: 500px;
            background: linear-gradient(135deg, #5E72E4 0%, #11CDEF 100%);
            color: #fff;
            border-radius: 30px;
            box-shadow: 0 0 30px rgba(0, 0, 0, .2);
            overflow: hidden;
        }
        .form-box {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px;
            transition: all .6s ease-in-out;
        }
        .form-box.login { left: 0; }
        .form-box.register { right: 0; transform: translateX(100%); opacity: 0; }
        
        .wrapper.active .form-box.login { transform: translateX(-100%); opacity: 0; }
        .wrapper.active .form-box.register { transform: translateX(0); opacity: 1; }

        .toggle-box {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: url('img/ecn1.jpeg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 40px;
            transition: all .6s ease-in-out;
            z-index: 10;
        }
        .toggle-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(23, 43, 77, 0.85); /* Slightly darker blue tint overlay */
            z-index: -1;
        }
        .toggle-box.right { right: 0; border-radius: 150px 0 0 150px; }
        .wrapper.active .toggle-box.right { right: 50%; border-radius: 0 150px 150px 0; }
        
        .toggle-panel { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; transition: .6s ease-in-out; }
        .toggle-panel.toggle-left { opacity: 0; pointer-events: none; }
        .wrapper.active .toggle-panel.toggle-left { opacity: 1; pointer-events: auto; }
        .wrapper.active .toggle-panel.toggle-right { opacity: 0; pointer-events: none; }
        
        .btn-toggle { background: transparent; border: 2px solid #fff; color: #fff; border-radius: 8px; padding: 10px 30px; font-weight: 600; cursor: pointer; transition: .3s; }
        .btn-toggle:hover { background: #fff; color: #5E72E4; }

        .input-box { position: relative; width: 100%; margin: 20px 0; }
        .input-box input { width: 100%; height: 50px; background: rgba(255, 255, 255, 0.2); color: #fff; border: 2px solid transparent; outline: none; border-radius: 8px; padding: 0 20px 0 45px; font-size: 16px; transition: 0.3s; }
        .input-box input::placeholder { color: rgba(255, 255, 255, 0.8); }
        .input-box input:focus { border: 2px solid #fff; background: rgba(255, 255, 255, 0.3); }
        .input-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 20px; color: #fff; }
        
        .btn-submit { width: 100%; height: 50px; background: #fff; border: none; border-radius: 8px; color: #5E72E4; font-size: 16px; font-weight: 700; cursor: pointer; transition: .3s; }
        .btn-submit:hover { background: #f0f2f5; transform: scale(1.02); }

        .logo-img { width: 80px; margin-bottom: 20px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
    </style>
</head>
<body>

<div class="wrapper" id="wrapper">
    <div class="form-box login">
        <h2 class="mb-4">Ingreso</h2>
        <div id="msg-login" class="alert alert-danger d-none"></div>
        <form onsubmit="event.preventDefault(); login();">
            <div class="input-box">
                <i class='bx bxs-user'></i>
                <input type="text" id="log-username" placeholder="Usuario" required>
            </div>
            <div class="input-box">
                <i class='bx bxs-lock-alt'></i>
                <input type="password" id="log-password" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="btn-submit mt-3">Ingresar</button>
        </form>
    </div>

    <div class="form-box register">
        <h2 class="mb-4">Crear Cuenta</h2>
        <div id="msg-reg" class="alert alert-info d-none"></div>
        <form onsubmit="event.preventDefault(); register();">
            <div class="input-box">
                <i class='bx bxs-user-detail'></i>
                <input type="text" id="reg-nombre" placeholder="Nombre Completo" required>
            </div>
            <div class="input-box">
                <i class='bx bxs-user'></i>
                <input type="text" id="reg-username" placeholder="Usuario" required>
            </div>
            <div class="input-box">
                <i class='bx bxs-lock-alt'></i>
                <input type="password" id="reg-password" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="btn-submit mt-3">Registrarse</button>
        </form>
    </div>

    <div class="toggle-box right">
        <div class="toggle-panel toggle-right">
            <img src="img/LOGO-ESEACERAMICA1-ALTA-40x73.jpg" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <h1>Hola, ¡Bienvenido!</h1>
            <p class="mt-3 mb-4">¿No tienes cuenta? Regístrate para solicitar acceso al sistema.</p>
            <button class="btn-toggle" onclick="document.getElementById('wrapper').classList.add('active')">Crear Cuenta</button>
        </div>
        <div class="toggle-panel toggle-left">
            <img src="img/LOGO-ESEACERAMICA1-ALTA-40x73.jpg" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <h1>¡Bienvenido de nuevo!</h1>
            <p class="mt-3 mb-4">Si ya tienes cuenta, ingresa con tus credenciales.</p>
            <button class="btn-toggle" onclick="document.getElementById('wrapper').classList.remove('active')">Ingresar</button>
        </div>
    </div>
</div>

<script>
    async function login() {
        const msg = document.getElementById('msg-login');
        msg.classList.add('d-none');
        
        const username = document.getElementById('log-username').value;
        const password = document.getElementById('log-password').value;

        try {
            const res = await fetch("/api/v1/usuarios/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();

            if (res.ok) {
                if (data.token) localStorage.setItem('token', data.token);
                localStorage.setItem('user_nombre', data.user.nombre);
                localStorage.setItem('user_perfil', data.user.perfil || 'Usuario');
                window.location.href = "dashboard.html";
            } else {
                const errMsg = (data.error && typeof data.error === 'object' ? data.error.message : data.error) || data.message || 'Error al ingresar';
                msg.innerText = errMsg;
                msg.classList.remove('d-none');
            }
        } catch (err) {
            msg.innerText = 'Error de conexión';
            msg.classList.remove('d-none');
        }
    }

    async function register() {
        const msg = document.getElementById('msg-reg');
        msg.classList.remove('alert-success', 'alert-danger');
        msg.classList.add('d-none');

        const nombre = document.getElementById('reg-nombre').value;
        const username = document.getElementById('reg-username').value;
        const password = document.getElementById('reg-password').value;

        try {
            const res = await fetch("/api/v1/usuarios/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nombre, username, password })
            });

            const data = await res.json();

            if (res.ok) {
                msg.classList.add('alert-success');
                msg.innerText = 'Cuenta creada. Pendiente de aprobación administrativa.';
                msg.classList.remove('d-none');
                setTimeout(() => {
                    document.getElementById('wrapper').classList.remove('active');
                    msg.classList.add('d-none');
                    document.getElementById('log-username').value = username;
                    document.getElementById('log-password').value = password;
                }, 3000);
            } else {
                msg.classList.add('alert-danger');
                const errMsg = (data.error && typeof data.error === 'object' ? data.error.message : data.error) || data.message || 'Error al registrar';
                msg.innerText = errMsg;
                msg.classList.remove('d-none');
            }
        } catch (err) {
            msg.classList.add('alert-danger');
            msg.innerText = 'Error de conexión';
            msg.classList.remove('d-none');
        }
    }
</script>

</body>
</html>
